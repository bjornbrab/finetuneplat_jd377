[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bjornbrab-finetuneplat_jd377"
version = "0.1.0"
description = "从样本里推断模型微调平台工程师·流水线的数据倾斜应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bjornbrab" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bjornbrab.github.io"
Repository = "https://github.com/bjornbrab/finetuneplat_jd377"
Issues = "https://github.com/bjornbrab/finetuneplat_jd377/issues"

[project.scripts]
finetuneplat_jd377 = "finetuneplat_jd377:main"

[tool.setuptools]
py-modules = ["finetuneplat_jd377"]
